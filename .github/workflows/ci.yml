name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build and test
        run: dotnet test Return.sln -c Release
      - name: Build Godot view
        run: dotnet build game/Return.Game.csproj -c Release

  soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Soak 100 worlds for 1 year
        run: bash tools/soak --worlds 100 --years 1 --out out/soak
      - uses: actions/upload-artifact@v4
        with:
          name: soak
          path: out/soak
