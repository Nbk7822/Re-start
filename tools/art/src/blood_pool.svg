<?xml version="1.0" encoding="UTF-8"?>
<!-- Blood pool under the downed and the dead: a spreading puddle with a darker, thicker middle, a
     tide line and a wet sheen. Greyscale with alpha; the view tints it and lets it spread and dry. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="edge" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="61" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="38" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="sheen" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g filter="url(#edge)">
    <ellipse cx="128" cy="130" rx="92" ry="78" fill="#7c7c7c"/>
    <ellipse cx="128" cy="130" rx="86" ry="72" fill="#a6a6a6"/>
    <ellipse cx="122" cy="126" rx="58" ry="48" fill="#8c8c8c"/>
    <ellipse cx="118" cy="122" rx="30" ry="24" fill="#6e6e6e"/>
    <circle cx="214" cy="96" r="7" fill="#a6a6a6"/>
    <circle cx="46" cy="176" r="5" fill="#a6a6a6"/>
    <circle cx="190" cy="196" r="9" fill="#a6a6a6"/>
  </g>
  <g filter="url(#sheen)" fill="#ffffff">
    <ellipse cx="96" cy="98" rx="30" ry="7" opacity="0.38" transform="rotate(-24 96 98)"/>
    <ellipse cx="150" cy="168" rx="16" ry="4" opacity="0.18" transform="rotate(-18 150 168)"/>
  </g>
</svg>
