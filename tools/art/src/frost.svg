<?xml version="1.0" encoding="UTF-8"?>
<!-- Tileable hoarfrost for winter: a cold pale veil with bright crystalline specks. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="veil" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03125" numOctaves="4" seed="29" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.80  0 0 0 0 0.85  0 0 0 0 0.90  2.6 0 0 0 -0.95"/>
    </filter>
    <filter id="specks" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.375" numOctaves="2" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.96  0 0 0 0 1  8 0 0 0 -4.6"/>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#veil)"/>
  <rect width="256" height="256" filter="url(#specks)"/>
</svg>
