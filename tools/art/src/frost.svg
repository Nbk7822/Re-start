<?xml version="1.0" encoding="UTF-8"?>
<!-- Tileable hoarfrost for winter: a soft cold veil, thicker in hollows, with sparse bright crystals. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="veil" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0234375" numOctaves="3" seed="29" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.82  0 0 0 0 0.86  0 0 0 0 0.90  1.7 0 0 0 -0.35"/>
    </filter>
    <filter id="specks" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.375" numOctaves="2" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.93  0 0 0 0 0.96  0 0 0 0 1  10 0 0 0 -6.4"/>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#veil)"/>
  <rect width="256" height="256" filter="url(#specks)"/>
</svg>
