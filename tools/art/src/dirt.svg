<?xml version="1.0" encoding="UTF-8"?>
<!-- Tileable dirt: pebbles, clods and grit scattered over open ground. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="clods" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.09375" numOctaves="3" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.09  0 0 0 0 0.06  11 0 0 0 -7.2"/>
    </filter>
    <filter id="pebbles" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.1875" numOctaves="2" seed="41" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.50  0 0 0 0 0.42  14 0 0 0 -9.9"/>
    </filter>
    <filter id="grit" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="turbulence" baseFrequency="0.0625" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0 0  -6 0 0 0 0.9"/>
      <feComponentTransfer><feFuncA type="linear" slope="1.4" intercept="-0.55"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#grit)"/>
  <rect width="256" height="256" filter="url(#clods)"/>
  <rect width="256" height="256" filter="url(#pebbles)"/>
</svg>
