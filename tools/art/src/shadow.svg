<?xml version="1.0" encoding="UTF-8"?>
<!-- Soft contact shadow: a feathered black disc, stretched by the view into the ellipse under a person, tree or bush. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="36" fill="#000000" filter="url(#soft)"/>
</svg>
