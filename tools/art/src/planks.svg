<?xml version="1.0" encoding="UTF-8"?>
<!-- Tileable weathered planks (floors, roof boards): four boards with grain, seams, joints, nails and grime. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0078125 0.25" numOctaves="3" seed="37" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.07  0 0 0 0 0.04  2.6 0 0 0 -0.95"/>
    </filter>
    <filter id="grime" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03125" numOctaves="4" seed="43" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.06  0 0 0 0 0.05  0 0 0 0 0.03  1.8 0 0 0 -0.75"/>
    </filter>
  </defs>
  <rect y="0" width="256" height="64" fill="#7a6650"/>
  <rect y="64" width="256" height="64" fill="#6f5c47"/>
  <rect y="128" width="256" height="64" fill="#806b53"/>
  <rect y="192" width="256" height="64" fill="#735f49"/>
  <rect width="256" height="256" filter="url(#grain)"/>
  <rect width="256" height="256" filter="url(#grime)"/>
  <g fill="#2a2119">
    <rect y="0" width="256" height="3"/>
    <rect y="64" width="256" height="3"/>
    <rect y="128" width="256" height="3"/>
    <rect y="192" width="256" height="3"/>
    <rect x="90" y="3" width="3" height="61"/>
    <rect x="30" y="67" width="3" height="61"/>
    <rect x="200" y="67" width="3" height="61"/>
    <rect x="140" y="131" width="3" height="61"/>
    <rect x="60" y="195" width="3" height="61"/>
    <rect x="232" y="195" width="3" height="61"/>
  </g>
  <g fill="#1d1813">
    <circle cx="84" cy="12" r="2.2"/><circle cx="84" cy="54" r="2.2"/><circle cx="99" cy="12" r="2.2"/><circle cx="99" cy="54" r="2.2"/>
    <circle cx="24" cy="76" r="2.2"/><circle cx="39" cy="118" r="2.2"/><circle cx="194" cy="76" r="2.2"/><circle cx="209" cy="118" r="2.2"/>
    <circle cx="134" cy="140" r="2.2"/><circle cx="149" cy="182" r="2.2"/>
    <circle cx="54" cy="204" r="2.2"/><circle cx="69" cy="246" r="2.2"/><circle cx="226" cy="204" r="2.2"/><circle cx="241" cy="246" r="2.2"/>
  </g>
  <g fill="#a08a6c" opacity="0.35">
    <rect y="3" width="256" height="1.5"/>
    <rect y="67" width="256" height="1.5"/>
    <rect y="131" width="256" height="1.5"/>
    <rect y="195" width="256" height="1.5"/>
  </g>
</svg>
