<?xml version="1.0" encoding="UTF-8"?>
<!-- Tileable fine grain: dark and light specks, the film-like noise over the ground. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="dark" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="5" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.035  0 0 0 0 0.03  7 0 0 0 -3.9"/>
    </filter>
    <filter id="light" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.82  0 0 0 0 0.70  7 0 0 0 -4.3"/>
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#dark)"/>
  <rect width="256" height="256" filter="url(#light)"/>
</svg>
