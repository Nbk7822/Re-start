<?xml version="1.0" encoding="UTF-8"?>
<!-- Scorch: where a vampire burned in the sun. A charred black core, a brown singed ring and grey ash. True colours. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="char" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4" seed="71" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="6"/>
    </filter>
    <filter id="core" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="73" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="2"/>
    </filter>
    <filter id="ash" filterUnits="userSpaceOnUse" x="0" y="0" width="256" height="256" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" seed="79"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.58  0 0 0 0 0.56  0 0 0 0 0.52  9 0 0 0 -5.6"/>
    </filter>
    <mask id="inside">
      <circle cx="128" cy="128" r="80" fill="#ffffff" filter="url(#char)"/>
    </mask>
  </defs>
  <circle cx="128" cy="128" r="86" fill="#3b2a1d" fill-opacity="0.75" filter="url(#char)"/>
  <circle cx="128" cy="128" r="54" fill="#0f0c0a" fill-opacity="0.92" filter="url(#core)"/>
  <rect width="256" height="256" filter="url(#ash)" mask="url(#inside)"/>
</svg>
